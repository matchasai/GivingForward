events {
    worker_connections 1024;
}

http {
    upstream auth-service {
        server auth-service:8081;
    }

    upstream campaign-service {
        server campaign-service:8082;
    }

    upstream donation-service {
        server donation-service:8083;
    }

    upstream admin-service {
        server admin-service:8084;
    }

    upstream upload-service {
        server upload-service:8085;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # Health check endpoint
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # Authentication routes
        location /api/auth/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://auth-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User account routes
        location /api/account/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://auth-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Campaign routes
        location /api/campaigns/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://campaign-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Donation routes
        location /api/donations/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://donation-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin routes
        location /api/admin/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://admin-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Upload routes
        location /api/uploads/ {
            limit_req zone=api burst=5 nodelay;
            client_max_body_size 10M;
            proxy_pass http://upload-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Public routes
        location /api/public/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://campaign-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Fallback for other API routes
        location /api/ {
            return 404 "API endpoint not found";
        }
    }
}