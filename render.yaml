services:
  - type: web
    name: givingforward-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://givingforward-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
