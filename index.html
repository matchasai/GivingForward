<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GivingForward - Fund Donation Platform</title>
    <meta name="description" content="Support meaningful campaigns and make a difference. Donate to causes you care about on GivingForward." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://givingforward.com/" />
    <meta property="og:title" content="GivingForward - Fund Donation Platform" />
    <meta property="og:description" content="Support meaningful campaigns and make a difference. Donate to causes you care about on GivingForward." />
    <meta property="og:image" content="https://givingforward.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://givingforward.com/" />
    <meta property="twitter:title" content="GivingForward - Fund Donation Platform" />
    <meta property="twitter:description" content="Support meaningful campaigns and make a difference. Donate to causes you care about on GivingForward." />
    <meta property="twitter:image" content="https://givingforward.com/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Razorpay Checkout script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
      // If redirected from 404.html with ?p=..., restore original path before app mounts
      (function(){
        try {
          var usp = new URLSearchParams(window.location.search);
          var p = usp.get('p');
          if (p) {
            var decoded = decodeURIComponent(p);
            // Only adjust history if we are currently at /index.html?p=...
            if (window.location.pathname.endsWith('/index.html')) {
              window.history.replaceState({}, '', decoded);
            }
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
