## MongoDB Configuration (primary datastore)
# Provide via environment variables. Prefer SPRING_DATA_MONGODB_URI, fallback to MONGODB_URI.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017}}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:GivingForward}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.path=${UPLOAD_PATH:uploads/}

# Server Configuration
# Use Render's PORT if present, else fallback to SERVER_PORT, else 8081
server.port=${PORT:${SERVER_PORT:8081}}

# Logging (default)
logging.level.org.springframework.security=INFO
logging.level.com.example.fundapp.security=INFO 

# Email Configuration 
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp

# Frontend URL (for password reset emails, etc.)
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Razorpay configuration (set via environment variables)
razorpay.keyId=${RAZORPAY_KEY_ID:}
razorpay.keySecret=${RAZORPAY_KEY_SECRET:}

# Load additional config from a local .env file (optional, for dev)
# This lets Spring read key=value pairs from backend/.env
spring.config.import=optional:file:.env[.properties]